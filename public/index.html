<!doctype html>
<html>

    <link rel="stylesheet" href="/css/student.css">
    <script src="/js/student.js" defer></script>
  </head>

    <button class="lang" id="lang">EN / МК</button>

    <div class="msg" id="msg"></div>
    <div class="anon" id="anon"></div>
